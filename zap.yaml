env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - https://reginsaqa.sunedu.gob.pe/#/home
    - https://reginsaqa.sunedu.gob.pe/
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 5
    url: https://reginsaqa.sunedu.gob.pe/
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules: []
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: reportes/security/2026-05-08_14-16/dast/zap/zap-baseline-report.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: reportes/security/2026-05-08_14-16/dast/zap/zap-baseline-report.md
    reportTitle: ZAP Scanning Report
    template: traditional-md
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: reportes/security/2026-05-08_14-16/dast/zap/zap-baseline-report.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report
