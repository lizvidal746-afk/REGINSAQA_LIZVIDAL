sonar.projectKey=reginsa-qa-framework
sonar.projectName=REGINSA QA Framework
sonar.sourceEncoding=UTF-8

sonar.sources=tests,core,scripts
sonar.exclusions=**/node_modules/**,**/playwright-report/**,**/allure-report/**,**/allure-results/**,**/test-results/**,**/reportes/**,**/playwrigth/**

sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts

# Coverage reports (if files exist in CI, Sonar imports them).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info,coverage/frontend/lcov.info
sonar.coverage.jacoco.xmlReportPaths=coverage/jacoco/jacoco.xml,coverage/backend/jacoco.xml
