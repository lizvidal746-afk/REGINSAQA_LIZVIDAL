# AWS CodeBuild Buildspec — Pipeline de Seguridad REGINSA-QA
# Herramientas (modo estandar, sin Docker privilegiado):
#   SAST:  Semgrep (pip), Bearer (binario), Checkov (pip), Gitleaks (binario), TruffleHog (binario)
#   SCA:   npm audit, OSV Scanner (npm), RetireJS (npm), Trivy fs (binario)
#   DAST:  ZAP/Nuclei/Nikto/Wapiti no disponibles sin Docker privilegiado
#          → activar "privileged mode" en el proyecto CodeBuild para herramientas Docker
# La URL del entorno QA se lee desde AWS SSM Parameter Store en /reginsa/qa/url

version: 0.2

env:
  parameter-store:
    REGINSA_URL: /reginsa/qa/url

phases:

  install:
    runtime-versions:
      nodejs: 20
      python: "3.11"
    commands:
      - echo "=== Instalando herramientas de seguridad ==="
      - npm ci

      # Gitleaks (binario)
      - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
      - tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin/ gitleaks
      - gitleaks version

      # TruffleHog (binario)
      - curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.2/trufflehog_3.95.2_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - trufflehog --version

      # Semgrep + Checkov (pip)
      - pip3 install semgrep checkov
      - semgrep --version && checkov --version

      # Trivy (binario via script)
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - trivy --version

      # OSV + RetireJS (npm global)
      - npm install -g @google/osv-scanner retire
      - osv-scanner --version || true

  pre_build:
    commands:
      # 1. Gitleaks — Secret Detection
      - echo "=== [1/8] Gitleaks — Secret Detection ==="
      - mkdir -p reportes/security/sast/gitleaks
      - gitleaks detect --source . --report-format json --report-path reportes/security/sast/gitleaks/gitleaks-report.json --config .gitleaks.toml || true

      # 2. TruffleHog — Deep Secret Scan (JSONL)
      - echo "=== [2/8] TruffleHog — Deep Secret Scan ==="
      - mkdir -p reportes/security/sast/trufflehog
      - trufflehog git file://. --json --no-update --only-verified > reportes/security/sast/trufflehog/trufflehog-report.jsonl 2>&1 || true

  build:
    commands:
      # 3. Semgrep — SAST
      - echo "=== [3/8] Semgrep — SAST ==="
      - mkdir -p reportes/security/sast/semgrep
      - semgrep scan --config auto --config p/owasp-top-ten --config p/typescript --config p/javascript --config p/secrets --json -o reportes/security/sast/semgrep/semgrep-report.json . || true

      # 4. Checkov — IaC/SAST SARIF
      - echo "=== [4/8] Checkov — IaC Security (SARIF) ==="
      - mkdir -p reportes/security/sast/checkov
      - checkov -d . --output sarif --output-file-path reportes/security/sast/checkov/ --soft-fail || true

      # 5. npm audit — SCA
      - echo "=== [5/8] npm audit — SCA ==="
      - mkdir -p reportes/security/sca/npm-audit
      - npm audit --audit-level=high --json > reportes/security/sca/npm-audit/npm-audit.json || true

      # 6. OSV Scanner — SCA (lockfile-based CVE lookup)
      - echo "=== [6/8] OSV Scanner — SCA ==="
      - mkdir -p reportes/security/sca/osv
      - osv-scanner --lockfile package-lock.json --format json > reportes/security/sca/osv/osv-results.json || true

      # 7. RetireJS — SCA Frontend
      - echo "=== [7/8] RetireJS — SCA Frontend ==="
      - mkdir -p reportes/security/sca/retirejs
      - retire --outputformat json --outputpath reportes/security/sca/retirejs/retire-results.json --path . || true

      # 8. Trivy — Filesystem Security
      - echo "=== [8/8] Trivy — Filesystem Security ==="
      - mkdir -p reportes/security/container/trivy
      - trivy fs . --severity HIGH,CRITICAL --format json --output reportes/security/container/trivy/trivy-report.json || true

  post_build:
    commands:
      - echo "=== Resumen de seguridad AWS CodeBuild ==="
      - |
        for tool in sast/gitleaks/gitleaks-report.json sast/semgrep/semgrep-report.json sca/osv/osv-results.json container/trivy/trivy-report.json; do
          f="reportes/security/$tool"
          if [ -f "$f" ]; then
            sz=$(wc -c < "$f")
            echo "  [OK] $tool ($sz bytes)"
          else
            echo "  [--] $tool no generado"
          fi
        done
      - echo "=== Pipeline de seguridad AWS CodeBuild completado ==="

reports:
  security-reports:
    files:
      - '**/*.json'
      - '**/*.sarif'
      - '**/*.jsonl'
    base-directory: 'reportes/security'
    discard-paths: no

artifacts:
  files:
    - 'reportes/security/**/*'
  discard-paths: no
  name: security-reports-$CODEBUILD_BUILD_ID
