# Azure Pipelines — Seguridad REGINSA (19 herramientas via run-all-security.ps1)
# Entrypoint unico: scripts/security/run-all-security.ps1
# SAST: Semgrep, Bearer, Gitleaks, TruffleHog, Checkov, (CodeQL opcional)
# SCA:  OSV, Dependency-Check, RetireJS, Grype, Trivy
# DAST: ZAP, Nuclei, Nikto, Wapiti, Restler
# Infra: Lynis  | Red: Nmap+Vulners (solo con autorizacion)
# SonarQube: pipeline separado azure-sonarqube-sync.yml

trigger: none
pr: none

parameters:
  - name: includeCodeQL
    displayName: Incluir CodeQL (~20 min, requiere imagen Docker reginsa-codeql)
    type: boolean
    default: false
  - name: includeSonar
    displayName: Incluir SonarQube (requiere SONAR_TOKEN y SONAR_HOST_URL)
    type: boolean
    default: false
  - name: skipDast
    displayName: Omitir DAST (ZAP/Nuclei/Nikto/Wapiti/Restler) — ejecutar solo SAST+SCA
    type: boolean
    default: false
  - name: includeNetwork
    displayName: Incluir Nmap+Vulners (requiere autorizacion formal)
    type: boolean
    default: false

variables:
  REGINSA_URL:    $(REGINSA_URL_SECRET)
  SONAR_HOST_URL: $(SONAR_HOST_URL_SECRET)
  SONAR_TOKEN:    $(SONAR_TOKEN_SECRET)

stages:
  - stage: SecurityScan
    displayName: "Seguridad — 19 herramientas (SAST + SCA + Container + DAST + Infra)"
    jobs:
      - job: RunAllSecurity
        displayName: "run-all-security.ps1 (orquestador maestro)"
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 90
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: Setup Node.js 20

          - script: npm ci
            displayName: Install npm dependencies

          - task: PowerShell@2
            displayName: "Run-All-Security (19 tools)"
            inputs:
              filePath: scripts/security/run-all-security.ps1
              arguments: >
                -Target "$(REGINSA_URL)"
                ${{ if eq(parameters.skipDast, true) }}-SkipDast${{ end }}
                ${{ if eq(parameters.includeCodeQL, true) }}-IncludeCodeQL${{ end }}
                ${{ if eq(parameters.includeSonar, true) }}-IncludeSonar${{ end }}
                ${{ if eq(parameters.includeNetwork, true) }}-IncludeNetwork${{ end }}
              pwsh: true
              failOnStderr: false
            env:
              SONAR_HOST_URL: $(SONAR_HOST_URL)
              SONAR_TOKEN:    $(SONAR_TOKEN)
              REGINSA_URL:    $(REGINSA_URL)

          - task: PublishBuildArtifacts@1
            condition: always()
            displayName: Publicar reportes de seguridad
            inputs:
              PathtoPublish: 'reportes/security'
              ArtifactName: 'security-reports'

  - stage: SonarReport
    displayName: "Reporte ejecutivo SonarQube"
    dependsOn: SecurityScan
    condition: and(succeededOrFailed(), eq('${{ parameters.includeSonar }}', 'true'))
    jobs:
      - job: SonarLocalReport
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Generar reporte ejecutivo SonarQube (ES+EN)
            inputs:
              filePath: scripts/security/generar-reporte-sonar-local.ps1
              arguments: >
                -SonarHostUrl "$(SONAR_HOST_URL)"
                -SonarToken "$(SONAR_TOKEN)"
              pwsh: true
            env:
              SONAR_HOST_URL: $(SONAR_HOST_URL)
              SONAR_TOKEN:    $(SONAR_TOKEN)
          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: 'reportes'
              ArtifactName: 'sonar-executive-reports'
