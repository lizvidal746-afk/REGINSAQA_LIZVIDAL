name: REGINSA Enterprise Pipeline

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: Tipo de suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - functional
          - regression
          - performance
          - k6
          - security
          - sonar
      workers:
        description: Número de workers Playwright
        required: false
        default: "4"
      repeat_each:
        description: Repeticiones por caso
        required: false
        default: "1"
      case_target:
        description: Caso funcional objetivo (01|02|03|04|suite)
        required: false
        default: "01"
      registros:
        description: Cantidad de registros objetivo
        required: false
        default: "10"
      headless:
        description: Ejecutar en headless
        required: false
        default: "1"
      environment:
        description: Ambiente
        required: false
        default: qa
      k6_output:
        description: Salida k6 (local|cloud)
        required: false
        default: local
      k6_sleep_seconds:
        description: Sleep por iteracion k6
        required: false
        default: "0"
      k6_perf_duration:
        description: Duracion k6 (45s, 2m, 5m)
        required: false
        default: "2m"
      k6_vus:
        description: VUs k6
        required: false
        default: "1"
      k6_expect_rate_limit:
        description: Esperar rate limit (1|0)
        required: false
        default: "1"
      k6_enforce_ok_rate:
        description: Exigir ok_rate (1|0)
        required: false
        default: "0"
      sonar_host_url:
        description: SonarQube URL (si vacio usa secret SONAR_HOST_URL)
        required: false
        default: ""
      security_tool:
        description: "Herramienta (all|sast|sca|dast|infra|individual tool)"
        required: false
        default: all
        type: choice
        options:
          - all
          - sast
          - sca
          - dast
          - infra
          - zap
          - nuclei
          - gitleaks
          - semgrep
          - trivy
          - depcheck
          - bearer
          - checkov
          - trufflehog
          - nikto
          - wapiti
          - restler
          - lynis
          - osv
          - retirejs
          - grype
          - codeql
      include_sonar:
        description: "Incluir SonarQube scan (requiere SONAR_TOKEN y SONAR_HOST_URL)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_network:
        description: "Incluir Nmap+Vulners (requiere autorizacion formal)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      REGINSA_URL: ${{ secrets.REGINSA_URL }}
      REGINSA_API_URL: ${{ secrets.REGINSA_API_URL }}
      BASE_URL: ${{ secrets.REGINSA_URL }}
      REGINSA_USER_1: ${{ secrets.REGINSA_USER_1 }}
      REGINSA_PASS_1: ${{ secrets.REGINSA_PASS_1 }}
      REGINSA_USER_2: ${{ secrets.REGINSA_USER_2 }}
      REGINSA_PASS_2: ${{ secrets.REGINSA_PASS_2 }}
      REGINSA_USER_3: ${{ secrets.REGINSA_USER_3 }}
      REGINSA_PASS_3: ${{ secrets.REGINSA_PASS_3 }}
      REGINSA_USER_4: ${{ secrets.REGINSA_USER_4 }}
      REGINSA_PASS_4: ${{ secrets.REGINSA_PASS_4 }}
      REGINSA_USER_5: ${{ secrets.REGINSA_USER_5 }}
      REGINSA_PASS_5: ${{ secrets.REGINSA_PASS_5 }}
      REGINSA_USER_6: ${{ secrets.REGINSA_USER_6 }}
      REGINSA_PASS_6: ${{ secrets.REGINSA_PASS_6 }}
      REGINSA_USER_7: ${{ secrets.REGINSA_USER_7 }}
      REGINSA_PASS_7: ${{ secrets.REGINSA_PASS_7 }}
      REGINSA_USER_8: ${{ secrets.REGINSA_USER_8 }}
      REGINSA_PASS_8: ${{ secrets.REGINSA_PASS_8 }}
      REGINSA_WORKERS: ${{ inputs.workers }}
      REGINSA_HEADLESS: ${{ inputs.headless }}
      REGINSA_TARGET_REGISTROS: ${{ inputs.registros }}
      REGINSA_ENVIRONMENT: ${{ inputs.environment }}
      REGINSA_CASO04_SKIP_EXHAUSTED_PAGES: "1"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run selected suite
        shell: bash
        run: |
          case "${{ inputs.test_type }}" in
            smoke) npm run test:smoke ;;
            functional)
              case "${{ inputs.case_target }}" in
                01) npm run test:01:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                02) npm run test:02:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                03) npm run test:03:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                04) npm run test:04:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                suite) npm run test:functional:suite -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                *) echo "case_target inválido: ${{ inputs.case_target }}"; exit 1 ;;
              esac ;;
            regression) npm run test:regression ;;
            performance) npm run test:performance ;;
            k6)
              # --- Fallback: si piden cloud pero no hay token, usar local ---
              K6_OUT="${{ inputs.k6_output }}"
              if [ "$K6_OUT" = "cloud" ]; then
                if [ -z "${{ secrets.K6_CLOUD_TOKEN }}" ] || [ -z "${{ secrets.K6_CLOUD_PROJECT_ID }}" ]; then
                  echo "[WARN] Cloud token no configurado, fallback a output=local"
                  K6_OUT="local"
                fi
              fi
              case "${{ inputs.case_target }}" in
                00) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso00-login.ps1 -K6Output "$K6_OUT" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                01) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso01-local.ps1 -Mode k6 -K6Output "$K6_OUT" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                02) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso02-local.ps1 -Mode k6 -K6Output "$K6_OUT" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -K6ExpectRateLimit "${{ inputs.k6_expect_rate_limit }}" -K6EnforceOkRate "${{ inputs.k6_enforce_ok_rate }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                03) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso03-local.ps1 -Mode k6 -K6Output "$K6_OUT" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -K6ExpectRateLimit "${{ inputs.k6_expect_rate_limit }}" -K6EnforceOkRate "${{ inputs.k6_enforce_ok_rate }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                04) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso04-local.ps1 -K6Output "$K6_OUT" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -K6ExpectRateLimit "${{ inputs.k6_expect_rate_limit }}" -K6EnforceOkRate "${{ inputs.k6_enforce_ok_rate }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                *) echo "case_target invalido para k6: ${{ inputs.case_target }}"; exit 1 ;;
              esac ;;
            security|sonar) echo "[CI] handled by dedicated pwsh steps below" ;;
          esac

      # ── Security: orquestador maestro (19 herramientas via run-all-security.ps1) ─────────
      - name: Security scan
        if: inputs.test_type == 'security'
        shell: pwsh
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url != '' && inputs.sonar_host_url || secrets.SONAR_HOST_URL }}
          REGINSA_URL:    ${{ secrets.REGINSA_URL }}
        run: |
          $tool        = '${{ inputs.security_tool }}'
          $date        = Get-Date -Format 'yyyy-MM-dd_HH-mm'
          $inclSonar   = '${{ inputs.include_sonar }}'   -eq 'true'
          $inclNetwork = '${{ inputs.include_network }}' -eq 'true'
          $inclCodeQL  = $tool -in @('all','codeql','sast')

          # Solo DAST necesita URL; si la herramienta es de tipo SAST/SCA/Infra, saltar DAST
          $skipDast = $tool -in @('sast','gitleaks','semgrep','bearer','checkov',
                                  'trufflehog','codeql','sca','trivy','depcheck',
                                  'osv','retirejs','grype','infra','lynis')

          $psArgs = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/security/run-all-security.ps1',
            '-Date', $date,
            '-Target', ($env:REGINSA_URL ?? '')
          )
          if ($skipDast)    { $psArgs += '-SkipDast' }
          if ($inclSonar)   { $psArgs += '-IncludeSonar' }
          if ($inclCodeQL)  { $psArgs += '-IncludeCodeQL' }
          if ($inclNetwork) { $psArgs += '-IncludeNetwork' }

          Write-Host "[CI] pwsh $($psArgs -join ' ')" -ForegroundColor Cyan
          & pwsh @psArgs
          # No salir con error para que los artefactos siempre se publiquen
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "[CI] Scan finalizo con exit $LASTEXITCODE (hallazgos criticos detectados)"
          }

      # ── SonarQube: escanear repos + generar reporte ejecutivo con timestamp ───────────────
      - name: SonarQube scan
        if: inputs.test_type == 'sonar'
        shell: pwsh
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url != '' && inputs.sonar_host_url || secrets.SONAR_HOST_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            Write-Error '[CI] SONAR_HOST_URL no configurado. Agrega el secret en Settings > Secrets > Actions.'
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            Write-Error '[CI] SONAR_TOKEN no configurado.'
            exit 1
          }
          # 1. Escanear repos con sonar-scanner
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/security/escanear-repos-sonar.ps1 -Projects frontend,backend,enlinea
          # 2. Generar reporte ejecutivo (ES+EN) con copia en reportes/informes/<stamp>/
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/security/generar-reporte-sonar-local.ps1 `
            -SonarHostUrl $env:SONAR_HOST_URL -SonarToken $env:SONAR_TOKEN

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reginsa-reports
          path: |
            playwright-report
            allure-report
            reportes
            test-results
