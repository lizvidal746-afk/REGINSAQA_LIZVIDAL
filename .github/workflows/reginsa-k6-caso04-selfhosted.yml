name: REGINSA K6 Caso 04 (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: "Auth mode: token|auto"
        required: false
        default: "token"
      k6_auth_header:
        description: "Token when auth_mode=token"
        required: false
        default: ""
      token1:
        description: "Alias token when auth_mode=token (equivale a TOKEN1 en terminal)"
        required: false
        default: ""
      run_mode:
        description: "k6 output mode: local|cloud"
        required: false
        default: "local"
      sleep_mode:
        description: "Sleep mode: zero|min|custom"
        required: false
        default: "min"
      smoke_mode:
        description: "Smoke mode true/false"
        required: false
        default: "false"
      sleep_seconds:
        description: "Used when sleep_mode=custom"
        required: false
        default: "0.2"
      burst_mode:
        description: "Burst mode true/false"
        required: false
        default: "true"
      fixed_vus:
        description: "VUs"
        required: false
        default: "8"
      fixed_iterations:
        description: "Total iterations"
        required: false
        default: "100"
      burst_iter_per_vu:
        description: "Burst iterations per VU (optional)"
        required: false
        default: ""
      perf_duration:
        description: "k6 PERF_DURATION (ej. 10m)"
        required: false
        default: "10m"
      upload_artifacts:
        description: "Upload artifacts (true/false)"
        required: false
        default: "true"

jobs:
  k6-caso04:
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    env:
      REGINSA_URL: ${{ secrets.REGINSA_URL }}
      REGINSA_API_BASE: ${{ secrets.REGINSA_API_BASE }}
      REGINSA_USER: ${{ secrets.REGINSA_USER }}
      REGINSA_PASS: ${{ secrets.REGINSA_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run K6 Caso 04
        env:
          AUTH_MODE: ${{ github.event.inputs.auth_mode || 'token' }}
          AUTH_HEADER_INPUT: ${{ github.event.inputs.k6_auth_header }}
          TOKEN1_INPUT: ${{ github.event.inputs.token1 }}
          RUN_MODE_INPUT: ${{ github.event.inputs.run_mode || 'local' }}
          SLEEP_MODE: ${{ github.event.inputs.sleep_mode || 'min' }}
          SMOKE_MODE: ${{ github.event.inputs.smoke_mode || 'false' }}
          SLEEP_SECONDS_INPUT: ${{ github.event.inputs.sleep_seconds || '0.2' }}
          BURST_MODE_INPUT: ${{ github.event.inputs.burst_mode || 'true' }}
          FIXED_VUS_INPUT: ${{ github.event.inputs.fixed_vus || '8' }}
          FIXED_ITER_INPUT: ${{ github.event.inputs.fixed_iterations || '100' }}
          BURST_ITER_PER_VU_INPUT: ${{ github.event.inputs.burst_iter_per_vu }}
          PERF_DURATION_INPUT: ${{ github.event.inputs.perf_duration || '10m' }}
        run: |
          @echo off
          setlocal
          if not exist reportes mkdir reportes

          set BASE_API_URL=%REGINSA_API_BASE%
          if "%BASE_API_URL%"=="" set BASE_API_URL=%REGINSA_URL%
          if "%BASE_API_URL%"=="" set BASE_API_URL=https://reginsaapiqa.sunedu.gob.pe/api

          set RUN_SLEEP=%SLEEP_SECONDS_INPUT%
          if /I "%SLEEP_MODE%"=="zero" set RUN_SLEEP=0
          if /I "%SLEEP_MODE%"=="min" set RUN_SLEEP=0.2

          if /I "%SMOKE_MODE%"=="true" (
            set FIXED_VUS_INPUT=1
            set FIXED_ITER_INPUT=10
            set BURST_MODE_INPUT=false
            set RUN_SLEEP=0.8
          )

          set AUTH_FLAGS=
          if /I "%AUTH_MODE%"=="token" (
            if not "%AUTH_HEADER_INPUT%"=="" set AUTH_FLAGS= --env K6_AUTH_HEADER=%AUTH_HEADER_INPUT%
            if "%AUTH_HEADER_INPUT%"=="" if not "%TOKEN1_INPUT%"=="" set AUTH_FLAGS= --env TOKEN1=%TOKEN1_INPUT%
          )
          if /I "%AUTH_MODE%"=="auto" (
            set AUTH_FLAGS= --env K6_AUTO_LOGIN=1 --env REGINSA_USER=%REGINSA_USER% --env REGINSA_PASS=%REGINSA_PASS%
          )

          set BURST_FLAGS=
          if /I "%BURST_MODE_INPUT%"=="true" set BURST_FLAGS= --env K6_BURST_MODE=1
          if not "%BURST_ITER_PER_VU_INPUT%"=="" set BURST_FLAGS=%BURST_FLAGS% --env K6_BURST_ITER_PER_VU=%BURST_ITER_PER_VU_INPUT%

          set TAG_FLAGS= --tag case=caso04 --tag mode=burst
          if /I "%BURST_MODE_INPUT%"=="false" set TAG_FLAGS= --tag case=caso04 --tag mode=shared

          set OUT_FLAG=
          if /I "%RUN_MODE_INPUT%"=="cloud" set OUT_FLAG=-o cloud

          k6 run %OUT_FLAG% tests/performance/k6/k6_caso_04_reconsiderar_con_sanciones.js %TAG_FLAGS% --env BASE_API=%BASE_API_URL% --env BASE_URL=%BASE_API_URL% --env PERF_DURATION=%PERF_DURATION_INPUT% --env K6_FIXED_VUS=%FIXED_VUS_INPUT% --env K6_FIXED_ITERATIONS=%FIXED_ITER_INPUT% --env K6_TOTAL_REGISTROS=%FIXED_ITER_INPUT% --env K6_SLEEP_SECONDS=%RUN_SLEEP% --env K6_DEBUG_ERRORS=1 --env K6_DEBUG_ERRORS_MAX=20 %AUTH_FLAGS% %BURST_FLAGS% --summary-export reportes/k6-caso04-selfhosted-summary.json

      - name: Upload artifacts
        if: always() && github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-caso04-selfhosted
          path: |
            reportes/k6-caso04-selfhosted-summary.json
          if-no-files-found: warn
