name: REGINSA Validaciones Caso 01 (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Playwright workers"
        required: false
        default: "1"
      repeat_each:
        description: "Playwright repeat-each"
        required: false
        default: "1"
      install_dependencies:
        description: "Run npm ci (true/false)"
        required: false
        default: "true"
      install_browser:
        description: "Install Playwright browser (true/false)"
        required: false
        default: "true"
      upload_artifacts:
        description: "Upload artifacts (true/false)"
        required: false
        default: "true"
      reginsa_url:
        description: "Override URL REGINSA (optional)"
        required: false
        default: ""
      credentials_json:
        description: "JSON array de credenciales [{\"usuario\":\"u\",\"contrasena\":\"p\"}] (optional)"
        required: false
        default: ""

jobs:
  validaciones-caso01:
    runs-on: [self-hosted, windows]
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd
    env:
      REGINSA_URL: ${{ github.event.inputs.reginsa_url || vars.REGINSA_URL || secrets.REGINSA_URL }}
      BASE_URL: ${{ github.event.inputs.reginsa_url || vars.REGINSA_URL || secrets.REGINSA_URL }}
      REGINSA_CREDENTIALS_JSON: ${{ github.event.inputs.credentials_json || vars.REGINSA_CREDENTIALS_JSON || secrets.REGINSA_CREDENTIALS_JSON || '' }}
      REGINSA_USER_1: ${{ secrets.REGINSA_USER_1 }}
      REGINSA_PASS_1: ${{ secrets.REGINSA_PASS_1 }}
      REGINSA_USER_2: ${{ secrets.REGINSA_USER_2 }}
      REGINSA_PASS_2: ${{ secrets.REGINSA_PASS_2 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify environment
        shell: cmd
        run: |
          echo === Node.js ===
          node --version
          echo === npm ===
          npm --version
          echo === Working directory ===
          cd
          echo === Workspace contents ===
          dir /b

      - name: Install dependencies
        if: ${{ github.event.inputs.install_dependencies == 'true' }}
        shell: cmd
        run: |
          if not exist node_modules\@playwright\test (
            echo [CI] node_modules no encontrado, ejecutando npm ci...
            npm ci
          ) else (
            echo [CI] node_modules ya existe, skip npm ci
          )

      - name: Install Playwright browsers
        if: ${{ github.event.inputs.install_browser == 'true' }}
        shell: cmd
        run: npx playwright install chromium --with-deps 2>nul || npx playwright install chromium

      - name: Run validaciones Caso 01
        run: npx playwright test tests/casos-prueba/01-agregar-administrado-validaciones.plantilla.spec.ts --workers=${{ github.event.inputs.workers || '1' }} --repeat-each=${{ github.event.inputs.repeat_each || '1' }} --project=chromium

      - name: Upload artifacts
        if: always() && github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validaciones-caso01-selfhosted
          path: |
            playwright-report
            test-results
            reportes
          if-no-files-found: warn
