name: 🌐 REGINSA Sec — DAST OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL objetivo para OWASP ZAP (deja vacío para usar REGINSA_URL secret)"
        required: false
        default: ""
      run_zap:
        description: "Ejecutar OWASP ZAP (true/false)"
        required: false
        default: "true"

jobs:
  dast-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      REGINSA_URL: ${{ github.event.inputs.target_url || secrets.REGINSA_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare security reports folder
        run: mkdir -p reportes/security

      - name: Run OWASP ZAP baseline
        if: github.event.inputs.run_zap != 'false'
        run: |
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "$REGINSA_URL" \
              -r "reportes/security/zap-baseline-report.html" \
              -J "reportes/security/zap-baseline-report.json" \
              -w "reportes/security/zap-baseline-report.md" \
              -a \
              -m 10

      - name: Upload ZAP DAST report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report-${{ github.run_number }}
          path: reportes/security/
          if-no-files-found: warn
