name: REGINSA K6 Caso 00 (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: "Auth mode: auto|token (default auto)"
        required: false
        default: "auto"
      k6_auth_header:
        description: "Bearer token when auth_mode=token"
        required: false
        default: ""
      token1:
        description: "Alias token when auth_mode=token"
        required: false
        default: ""
      fixed_vus:
        description: "VUs (default 2 for smoke)"
        required: false
        default: "2"
      fixed_iterations:
        description: "Total iterations (default 5 for smoke)"
        required: false
        default: "5"
      strict_unique:
        description: "K6_STRICT_UNIQUE 1|0"
        required: false
        default: "1"
      upload_artifacts:
        description: "Upload artifacts (true/false)"
        required: false
        default: "true"

jobs:
  k6-caso00:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    env:
      REGINSA_URL: ${{ secrets.REGINSA_URL }}
      REGINSA_API_BASE: ${{ secrets.REGINSA_API_BASE }}
      REGINSA_USER: ${{ secrets.REGINSA_USER }}
      REGINSA_PASS: ${{ secrets.REGINSA_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run K6 Caso 00 (Smoke - Login/Logout)
        env:
          AUTH_MODE: ${{ github.event.inputs.auth_mode || 'auto' }}
          AUTH_HEADER_INPUT: ${{ github.event.inputs.k6_auth_header }}
          TOKEN1_INPUT: ${{ github.event.inputs.token1 }}
          FIXED_VUS_INPUT: ${{ github.event.inputs.fixed_vus || '2' }}
          FIXED_ITER_INPUT: ${{ github.event.inputs.fixed_iterations || '5' }}
          STRICT_UNIQUE_INPUT: ${{ github.event.inputs.strict_unique || '1' }}
        run: |
          @echo off
          setlocal
          if not exist reportes mkdir reportes

          set BASE_API_URL=%REGINSA_API_BASE%
          if "%BASE_API_URL%"=="" set BASE_API_URL=%REGINSA_URL%
          if "%BASE_API_URL%"=="" set BASE_API_URL=https://reginsaapiqa.sunedu.gob.pe/api

          set AUTH_FLAGS=
          if /I "%AUTH_MODE%"=="token" (
            if not "%AUTH_HEADER_INPUT%"=="" set AUTH_FLAGS= --env K6_AUTH_HEADER=%AUTH_HEADER_INPUT%
            if "%AUTH_HEADER_INPUT%"=="" if not "%TOKEN1_INPUT%"=="" set AUTH_FLAGS= --env TOKEN1=%TOKEN1_INPUT%
          )
          if /I "%AUTH_MODE%"=="auto" (
            set AUTH_FLAGS= --env K6_AUTO_LOGIN=1 --env REGINSA_USER=%REGINSA_USER% --env REGINSA_PASS=%REGINSA_PASS%
          )

          k6 run tests/performance/k6/k6_caso_00_login.js --env BASE_URL=%BASE_API_URL% --env K6_FIXED_VUS=%FIXED_VUS_INPUT% --env K6_FIXED_ITERATIONS=%FIXED_ITER_INPUT% --env K6_STRICT_UNIQUE=%STRICT_UNIQUE_INPUT% %AUTH_FLAGS% --summary-export reportes/k6-caso00-selfhosted-summary.json

      - name: Upload artifacts
        if: always() && github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-caso00-selfhosted
          path: |
            reportes/k6-caso00-selfhosted-summary.json
          if-no-files-found: warn
