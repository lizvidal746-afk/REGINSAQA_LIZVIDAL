name: REGINSA Smoke Caso04 Cloud (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      k6_output:
        description: "Salida k6: local|cloud (cloud requiere K6_CLOUD_TOKEN secret)"
        required: false
        default: "local"
      cantidad:
        description: "Cantidad objetivo"
        required: false
        default: "3"
      upload_artifacts:
        description: "Upload artifacts (true/false)"
        required: false
        default: "true"

jobs:
  run:
    uses: ./.github/workflows/reusable-k6-smoke-caso-selfhosted.yml
    with:
      case_id: "04"
      script_path: scripts/run-caso04-local.ps1
      mode: ""
      k6_output: ${{ github.event.inputs.k6_output || 'local' }}
      cantidad: ${{ github.event.inputs.cantidad || '3' }}
      rate_limit_args: "true"
      upload_artifacts: ${{ github.event.inputs.upload_artifacts || 'true' }}
    secrets: inherit
