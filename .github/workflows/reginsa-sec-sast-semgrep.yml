name: 🔍 REGINSA Sec — SAST Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/javascript \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        continue-on-error: true

      - name: Prepare artifact folder
        if: always()
        run: mkdir -p reportes/security/semgrep && cp semgrep-results.sarif reportes/security/semgrep/ 2>/dev/null || true

      - name: Upload Semgrep report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reportes/security/semgrep/
          if-no-files-found: warn
