name: REGINSA Postman Caso 02 (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload artifacts (true/false)"
        required: false
        default: "true"

jobs:
  run:
    uses: ./.github/workflows/reusable-postman-caso-selfhosted.yml
    with:
      caso: "02"
      upload_artifacts: ${{ github.event.inputs.upload_artifacts || 'true' }}
    secrets: inherit
