name: REGINSA Performance K6 (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      case_target:
        description: "Case: 00|01|02|03|04"
        required: false
        default: "02"
      k6_output:
        description: "Output: local|cloud (cloud requiere K6_CLOUD_TOKEN secret)"
        required: false
        default: "local"
      cantidad:
        description: "Cantidad total de iteraciones/registros"
        required: false
        default: "10"
      vus:
        description: "VUs"
        required: false
        default: "1"
      perf_duration:
        description: "Duracion (ej: 45s, 2m, 5m)"
        required: false
        default: "2m"
      k6_sleep_seconds:
        description: "Sleep por iteracion (default 0)"
        required: false
        default: "0"
      k6_expect_rate_limit:
        description: "Espera rate limit? 1|0"
        required: false
        default: "1"
      k6_enforce_ok_rate:
        description: "Exigir ok_rate? 1|0"
        required: false
        default: "0"
      grafana_project_id:
        description: "Opcional: override project id"
        required: false
        default: ""
      grafana_token:
        description: "Opcional: override token"
        required: false
        default: ""
      upload_artifacts:
        description: "Upload k6 artifacts (true/false)"
        required: false
        default: "true"

jobs:
  k6-selfhosted:
    runs-on: [self-hosted, windows]
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    env:
      REGINSA_URL: ${{ secrets.REGINSA_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify environment
        shell: cmd
        run: |
          echo === Node.js ===
          node --version
          echo === npm ===
          npm --version
          echo === Working directory ===
          cd
          echo === Workspace contents ===
          dir /b

      - name: Install dependencies
        shell: cmd
        run: |
          if not exist node_modules (
            echo [CI] node_modules no encontrado, ejecutando npm ci...
            npm ci
          ) else (
            echo [CI] node_modules ya existe, skip npm ci
          )

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Verify k6
        shell: cmd
        run: k6 version || echo [WARN] k6 no encontrado, instalar manualmente en el runner

      - name: Prepare reports folder
        run: if not exist reportes mkdir reportes

      - name: Run k6 case
        env:
          CASE_TARGET: ${{ github.event.inputs.case_target || '02' }}
          RUN_OUTPUT_REQUESTED: ${{ github.event.inputs.k6_output || 'local' }}
          RUN_CANTIDAD: ${{ github.event.inputs.cantidad || '10' }}
          RUN_VUS: ${{ github.event.inputs.vus || '1' }}
          RUN_DURATION: ${{ github.event.inputs.perf_duration || '2m' }}
          RUN_SLEEP: ${{ github.event.inputs.k6_sleep_seconds || '0' }}
          RUN_EXPECT_LIMIT: ${{ github.event.inputs.k6_expect_rate_limit || '1' }}
          RUN_ENFORCE_OK: ${{ github.event.inputs.k6_enforce_ok_rate || '0' }}
          RUN_PROJECT_INPUT: ${{ github.event.inputs.grafana_project_id || '' }}
          RUN_TOKEN_INPUT: ${{ github.event.inputs.grafana_token || '' }}
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: ${{ secrets.K6_CLOUD_PROJECT_ID }}
        shell: pwsh
        run: |
          $output = $env:RUN_OUTPUT_REQUESTED
          if ($output -eq 'cloud' -and (-not $env:K6_CLOUD_TOKEN -or -not $env:K6_CLOUD_PROJECT_ID)) {
            if (-not $env:RUN_TOKEN_INPUT -or -not $env:RUN_PROJECT_INPUT) {
              Write-Host "[WARN] Cloud token no configurado, fallback a output=local"
              $output = 'local'
            }
          }
          if (-not (Test-Path reportes)) { New-Item -ItemType Directory -Path reportes | Out-Null }

          $projectArg = @()
          $tokenArg = @()
          if ($env:RUN_PROJECT_INPUT) { $projectArg = @('--project', $env:RUN_PROJECT_INPUT) }
          elseif ($env:K6_CLOUD_PROJECT_ID) { $projectArg = @('--project', $env:K6_CLOUD_PROJECT_ID) }
          if ($env:RUN_TOKEN_INPUT) { $tokenArg = @('--token', $env:RUN_TOKEN_INPUT) }
          elseif ($env:K6_CLOUD_TOKEN) { $tokenArg = @('--token', $env:K6_CLOUD_TOKEN) }

          $common = @('-K6Output', $output, '-K6Cantidad', $env:RUN_CANTIDAD, '-K6Vus', $env:RUN_VUS, '-PerfDuration', $env:RUN_DURATION, '-K6SleepSeconds', $env:RUN_SLEEP)

          switch ($env:CASE_TARGET) {
            '00' {
              & powershell.exe -ExecutionPolicy Bypass -File scripts/run-caso00-login.ps1 @common @projectArg @tokenArg
            }
            '01' {
              & powershell.exe -ExecutionPolicy Bypass -File scripts/run-caso01-local.ps1 -Mode k6 @common @projectArg @tokenArg
            }
            '02' {
              & powershell.exe -ExecutionPolicy Bypass -File scripts/run-caso02-local.ps1 -Mode k6 @common -K6ExpectRateLimit $env:RUN_EXPECT_LIMIT -K6EnforceOkRate $env:RUN_ENFORCE_OK @projectArg @tokenArg
            }
            '03' {
              & powershell.exe -ExecutionPolicy Bypass -File scripts/run-caso03-local.ps1 -Mode k6 @common -K6ExpectRateLimit $env:RUN_EXPECT_LIMIT -K6EnforceOkRate $env:RUN_ENFORCE_OK @projectArg @tokenArg
            }
            '04' {
              & powershell.exe -ExecutionPolicy Bypass -File scripts/run-caso04-local.ps1 @common -K6ExpectRateLimit $env:RUN_EXPECT_LIMIT -K6EnforceOkRate $env:RUN_ENFORCE_OK @projectArg @tokenArg
            }
            default {
              Write-Error "ERROR: case_target invalido. Use 00, 01, 02, 03 o 04."
              exit 1
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload k6 artifacts
        if: always() && github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-artifacts-selfhosted-${{ github.event.inputs.case_target || '02' }}
          path: |
            reportes/*.json
            reportes/**/*.json
          if-no-files-found: warn
