name: REGINSA Performance K6 (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      case_target:
        description: "Case: 00|01|02|03|04"
        required: false
        default: "02"
      k6_output:
        description: "Output: local|cloud"
        required: false
        default: "cloud"
      cantidad:
        description: "Cantidad total de iteraciones/registros"
        required: false
        default: "10"
      vus:
        description: "VUs"
        required: false
        default: "1"
      perf_duration:
        description: "Duracion (ej: 45s, 2m, 5m)"
        required: false
        default: "2m"
      k6_sleep_seconds:
        description: "Sleep por iteracion (default 0)"
        required: false
        default: "0"
      k6_expect_rate_limit:
        description: "Espera rate limit? 1|0"
        required: false
        default: "1"
      k6_enforce_ok_rate:
        description: "Exigir ok_rate? 1|0"
        required: false
        default: "0"
      grafana_project_id:
        description: "Opcional: override project id"
        required: false
        default: ""
      grafana_token:
        description: "Opcional: override token"
        required: false
        default: ""
      upload_artifacts:
        description: "Upload k6 artifacts (true/false)"
        required: false
        default: "true"

jobs:
  k6-selfhosted:
    runs-on: [self-hosted, windows]
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    env:
      REGINSA_URL: ${{ secrets.REGINSA_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Prepare reports folder
        run: if not exist reportes mkdir reportes

      - name: Run k6 case
        env:
          CASE_TARGET: ${{ github.event.inputs.case_target || '02' }}
          RUN_OUTPUT: ${{ github.event.inputs.k6_output || 'cloud' }}
          RUN_CANTIDAD: ${{ github.event.inputs.cantidad || '10' }}
          RUN_VUS: ${{ github.event.inputs.vus || '1' }}
          RUN_DURATION: ${{ github.event.inputs.perf_duration || '2m' }}
          RUN_SLEEP: ${{ github.event.inputs.k6_sleep_seconds || '0' }}
          RUN_EXPECT_LIMIT: ${{ github.event.inputs.k6_expect_rate_limit || '1' }}
          RUN_ENFORCE_OK: ${{ github.event.inputs.k6_enforce_ok_rate || '0' }}
          RUN_PROJECT_INPUT: ${{ github.event.inputs.grafana_project_id || '' }}
          RUN_TOKEN_INPUT: ${{ github.event.inputs.grafana_token || '' }}
        run: |
          @echo off
          setlocal

          set PROJECT_ARG=
          set TOKEN_ARG=

          if not "%RUN_PROJECT_INPUT%"=="" (
            set PROJECT_ARG= --project=%RUN_PROJECT_INPUT%
          ) else if not "%K6_CLOUD_PROJECT_ID%"=="" (
            set PROJECT_ARG= --project=%K6_CLOUD_PROJECT_ID%
          )

          if not "%RUN_TOKEN_INPUT%"=="" (
            set TOKEN_ARG= --token=%RUN_TOKEN_INPUT%
          ) else if not "%K6_CLOUD_TOKEN%"=="" (
            set TOKEN_ARG= --token=%K6_CLOUD_TOKEN%
          )

          if /I "%CASE_TARGET%"=="00" (
            powershell -ExecutionPolicy Bypass -File scripts/run-caso00-login.ps1 -K6Output %RUN_OUTPUT% -K6Cantidad %RUN_CANTIDAD% -K6Vus %RUN_VUS% -PerfDuration %RUN_DURATION% -K6SleepSeconds %RUN_SLEEP% %PROJECT_ARG% %TOKEN_ARG%
            goto :eof
          )

          if /I "%CASE_TARGET%"=="01" (
            powershell -ExecutionPolicy Bypass -File scripts/run-caso01-local.ps1 -Mode k6 -K6Output %RUN_OUTPUT% -K6Cantidad %RUN_CANTIDAD% -K6Vus %RUN_VUS% -PerfDuration %RUN_DURATION% -K6SleepSeconds %RUN_SLEEP% %PROJECT_ARG% %TOKEN_ARG%
            goto :eof
          )

          if /I "%CASE_TARGET%"=="02" (
            powershell -ExecutionPolicy Bypass -File scripts/run-caso02-local.ps1 -Mode k6 -K6Output %RUN_OUTPUT% -K6Cantidad %RUN_CANTIDAD% -K6Vus %RUN_VUS% -PerfDuration %RUN_DURATION% -K6SleepSeconds %RUN_SLEEP% -K6ExpectRateLimit %RUN_EXPECT_LIMIT% -K6EnforceOkRate %RUN_ENFORCE_OK% %PROJECT_ARG% %TOKEN_ARG%
            goto :eof
          )

          if /I "%CASE_TARGET%"=="03" (
            powershell -ExecutionPolicy Bypass -File scripts/run-caso03-local.ps1 -Mode k6 -K6Output %RUN_OUTPUT% -K6Cantidad %RUN_CANTIDAD% -K6Vus %RUN_VUS% -PerfDuration %RUN_DURATION% -K6SleepSeconds %RUN_SLEEP% -K6ExpectRateLimit %RUN_EXPECT_LIMIT% -K6EnforceOkRate %RUN_ENFORCE_OK% %PROJECT_ARG% %TOKEN_ARG%
            goto :eof
          )

          if /I "%CASE_TARGET%"=="04" (
            powershell -ExecutionPolicy Bypass -File scripts/run-caso04-local.ps1 -K6Output %RUN_OUTPUT% -K6Cantidad %RUN_CANTIDAD% -K6Vus %RUN_VUS% -PerfDuration %RUN_DURATION% -K6SleepSeconds %RUN_SLEEP% -K6ExpectRateLimit %RUN_EXPECT_LIMIT% -K6EnforceOkRate %RUN_ENFORCE_OK% %PROJECT_ARG% %TOKEN_ARG%
            goto :eof
          )

          echo ERROR: case_target invalido. Use 00, 01, 02, 03 o 04.
          exit /b 1

      - name: Upload k6 artifacts
        if: always() && github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-artifacts-selfhosted-${{ github.event.inputs.case_target || '02' }}
          path: |
            reportes/*.json
            reportes/**/*.json
          if-no-files-found: warn
