name: REGINSA Enterprise Pipeline

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: Tipo de suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - functional
          - regression
          - performance
          - k6
          - security
          - sonar
      workers:
        description: Número de workers Playwright
        required: false
        default: "4"
      repeat_each:
        description: Repeticiones por caso
        required: false
        default: "1"
      case_target:
        description: Caso funcional objetivo (01|02|03|04|suite)
        required: false
        default: "01"
      registros:
        description: Cantidad de registros objetivo
        required: false
        default: "10"
      headless:
        description: Ejecutar en headless
        required: false
        default: "1"
      environment:
        description: Ambiente
        required: false
        default: qa
      k6_output:
        description: Salida k6 (local|cloud)
        required: false
        default: local
      k6_sleep_seconds:
        description: Sleep por iteracion k6
        required: false
        default: "0"
      k6_perf_duration:
        description: Duracion k6 (45s, 2m, 5m)
        required: false
        default: "2m"
      k6_vus:
        description: VUs k6
        required: false
        default: "1"
      k6_expect_rate_limit:
        description: Esperar rate limit (1|0)
        required: false
        default: "1"
      k6_enforce_ok_rate:
        description: Exigir ok_rate (1|0)
        required: false
        default: "0"
      sonar_host_url:
        description: SonarQube URL (si vacio usa secret SONAR_HOST_URL)
        required: false
        default: ""

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      REGINSA_URL: ${{ secrets.REGINSA_URL }}
      BASE_URL: ${{ secrets.REGINSA_URL }}
      REGINSA_USER_1: ${{ secrets.REGINSA_USER_1 }}
      REGINSA_PASS_1: ${{ secrets.REGINSA_PASS_1 }}
      REGINSA_USER_2: ${{ secrets.REGINSA_USER_2 }}
      REGINSA_PASS_2: ${{ secrets.REGINSA_PASS_2 }}
      REGINSA_USER_3: ${{ secrets.REGINSA_USER_3 }}
      REGINSA_PASS_3: ${{ secrets.REGINSA_PASS_3 }}
      REGINSA_USER_4: ${{ secrets.REGINSA_USER_4 }}
      REGINSA_PASS_4: ${{ secrets.REGINSA_PASS_4 }}
      REGINSA_USER_5: ${{ secrets.REGINSA_USER_5 }}
      REGINSA_PASS_5: ${{ secrets.REGINSA_PASS_5 }}
      REGINSA_USER_6: ${{ secrets.REGINSA_USER_6 }}
      REGINSA_PASS_6: ${{ secrets.REGINSA_PASS_6 }}
      REGINSA_USER_7: ${{ secrets.REGINSA_USER_7 }}
      REGINSA_PASS_7: ${{ secrets.REGINSA_PASS_7 }}
      REGINSA_USER_8: ${{ secrets.REGINSA_USER_8 }}
      REGINSA_PASS_8: ${{ secrets.REGINSA_PASS_8 }}
      REGINSA_WORKERS: ${{ inputs.workers }}
      REGINSA_HEADLESS: ${{ inputs.headless }}
      REGINSA_TARGET_REGISTROS: ${{ inputs.registros }}
      REGINSA_ENVIRONMENT: ${{ inputs.environment }}
      REGINSA_CASO04_SKIP_EXHAUSTED_PAGES: "1"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run selected suite
        shell: bash
        run: |
          case "${{ inputs.test_type }}" in
            smoke) npm run test:smoke ;;
            functional)
              case "${{ inputs.case_target }}" in
                01) npm run test:01:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                02) npm run test:02:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                03) npm run test:03:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                04) npm run test:04:scale -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                suite) npm run test:functional:suite -- --workers=${{ inputs.workers }} --repeat-each=${{ inputs.repeat_each }} --project=chromium ;;
                *) echo "case_target inválido: ${{ inputs.case_target }}"; exit 1 ;;
              esac ;;
            regression) npm run test:regression ;;
            performance) npm run test:performance ;;
            k6)
              case "${{ inputs.case_target }}" in
                00) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso00-login.ps1 -K6Output "${{ inputs.k6_output }}" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                01) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso01-local.ps1 -Mode k6 -K6Output "${{ inputs.k6_output }}" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                02) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso02-local.ps1 -Mode k6 -K6Output "${{ inputs.k6_output }}" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -K6ExpectRateLimit "${{ inputs.k6_expect_rate_limit }}" -K6EnforceOkRate "${{ inputs.k6_enforce_ok_rate }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                03) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso03-local.ps1 -Mode k6 -K6Output "${{ inputs.k6_output }}" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -K6ExpectRateLimit "${{ inputs.k6_expect_rate_limit }}" -K6EnforceOkRate "${{ inputs.k6_enforce_ok_rate }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                04) pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-caso04-local.ps1 -K6Output "${{ inputs.k6_output }}" -K6Cantidad "${{ inputs.registros }}" -K6Vus "${{ inputs.k6_vus }}" -PerfDuration "${{ inputs.k6_perf_duration }}" -K6SleepSeconds "${{ inputs.k6_sleep_seconds }}" -K6ExpectRateLimit "${{ inputs.k6_expect_rate_limit }}" -K6EnforceOkRate "${{ inputs.k6_enforce_ok_rate }}" -GrafanaProjectId "${{ secrets.K6_CLOUD_PROJECT_ID }}" -GrafanaToken "${{ secrets.K6_CLOUD_TOKEN }}" ;;
                *) echo "case_target invalido para k6: ${{ inputs.case_target }}"; exit 1 ;;
              esac ;;
            security)
              pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/security/generar-reportes-owasp-fechados.ps1 -Target "${{ secrets.REGINSA_URL }}" -BaseDir "reportes/security"
              ;;
            sonar)
              if [ -n "${{ inputs.sonar_host_url }}" ]; then
                export SONAR_HOST_URL="${{ inputs.sonar_host_url }}"
              fi
              pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/security/escanear-repos-sonar.ps1 -Projects frontend,backend,enlinea
              ;;
          esac

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reginsa-reports
          path: |
            playwright-report
            allure-report
            reportes
            test-results
